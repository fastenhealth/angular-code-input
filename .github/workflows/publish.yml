name: Publish package

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  id-token: write # Required for OIDC authentication
  contents: write # Allows the workflow to read repository contents
  packages: write # Allows publishing to GitHub Packages
concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Configure git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install dependencies
        run: npm ci

      - name: Bump package versions (commit + tag)
        id: bump
        run: |
          npm version "${{ inputs.bump }}" --no-git-tag-version
          version="$(node -p "require('./package.json').version")"
          npm pkg set "version=$version" --prefix angular-code-input
          git add package.json package-lock.json angular-code-input/package.json
          git commit -m "chore(release): $version [skip ci]"
          git tag -a "v$version" -m "v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Build package
        run: npm run build -- --configuration production

      - name: Lint package
        run: npm run lint

      - name: Test package
        run: npm test -- --watch=false --browsers=ChromeHeadless --code-coverage

      - name: Publish Angular library to npm
        run: NODE_AUTH_TOKEN="" npm publish ./dist/angular-code-input --ignore-scripts --access public

      - name: Configure GitHub Packages registry
        uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: "@fastenhealth"
          package-manager-cache: false

      - name: Publish Angular library to GitHub Packages
        run: npm publish ./dist/angular-code-input --ignore-scripts --access public --registry https://npm.pkg.github.com --provenance=false
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push commit and tag
        run: |
          git push origin HEAD:${{ github.ref_name }}
          git push origin --tags

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.bump.outputs.tag }}
          name: ${{ steps.bump.outputs.tag }}
          generate_release_notes: true
